<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>섬과 다리</title><link rel="stylesheet" href="style.css"><main>
<header><strong>섬과 다리</strong><button id="mapbtn">내 보드 보기</button></header>
<section id="intro" class="paper"><h1>각자의 섬을<br>만들어주세요</h1><form id="entry"><label>함께할 캐릭터<div id="avatars" class="avatars" role="group" aria-label="캐릭터 선택"></div></label><div class="tags"><label><input type="checkbox" value="돌아보게 된 생각"> 돌아보게 된 생각</label><label><input type="checkbox" value="우리 주변의 장벽"> 우리 주변의 장벽</label></div><label>섬 이름<input name="title" required maxlength="24" placeholder="예: 편견섬, 비난섬, 차별섬"></label><label>무엇이 우리 사이를 멀게 했나요?<textarea name="body" required maxlength="240"></textarea></label><button class="primary">섬 만들기</button></form><button id="sample">연결된 섬 예시 보기</button></section>
<section id="board" hidden><div class="bar"><b id="caption"></b><button id="newbtn">섬 만들기</button></div><div class="scroll"><div id="world"><svg id="lines" aria-hidden="true"></svg><div id="nodes"></div></div></div><footer><button id="listbtn">내 이야기 모아보기</button><button id="csv">나눔 내용 내려받기</button></footer></section>
<section id="mine" class="paper" hidden><h2>내 이야기 모아보기</h2><table><thead><tr><th>속성</th><th>제목</th><th>내용</th></tr></thead><tbody></tbody></table></section><dialog id="modal"></dialog><p id="status" role="status"></p></main><script src="config.js"></script><script src="app.js"></script></html>
